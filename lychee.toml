# lychee link checker configuration. Run `npm run links` from this directory.

# Treat these HTTP responses as success. 429 is "slow down", not "gone".
accept = [200, 201, 202, 203, 204, 206, 429]
max_retries = 2
timeout = 20
no_progress = true

# Local and placeholder hosts never resolve from CI.
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://[^/]*\\.example\\.com",
]
exclude_path = ["node_modules", "build", ".docusaurus"]
