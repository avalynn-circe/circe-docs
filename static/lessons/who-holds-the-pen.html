<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Who Holds the Pen</title>

<style>
/* Layout: a circle of chairs (circle practice) is the hub; each chair opens one hands-on station; the centerpiece gathers the learner's choices into a reflection. */
:root {
  --bg: #EDF0F0; --surface: #FBFCFB; --ink: #172030; --muted: #566072; --line: #CDD3D6;
  --marker: #2347C5; --marker-soft: #DFE6FA; --on-marker: #FFFFFF;
  --amber: #A65F00; --amber-soft: #F6E5CB;
  --sage: #2F6E52; --sage-soft: #DAEAE1;
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141B; --surface: #181E28; --ink: #E3E7EE; --muted: #9AA4B5; --line: #2B3342;
    --marker: #8EA8FF; --marker-soft: #1F2A4C; --on-marker: #10141B;
    --amber: #F1B65C; --amber-soft: #3A2B15;
    --sage: #7DCAA3; --sage-soft: #18332A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141B; --surface: #181E28; --ink: #E3E7EE; --muted: #9AA4B5; --line: #2B3342;
  --marker: #8EA8FF; --marker-soft: #1F2A4C; --on-marker: #10141B;
  --amber: #F1B65C; --amber-soft: #3A2B15;
  --sage: #7DCAA3; --sage-soft: #18332A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.gutter { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; font-weight: 600; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; border-radius: 8px; }
.kicker { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 1rem; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .gutter { display: flex; align-items: center; gap: 0.75rem; padding-block: 0.55rem; }
.bar-home { background: none; border: 0; padding: 0.2rem 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; white-space: nowrap; }
.bar-chairs { display: flex; gap: 0.35rem; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; padding: 2px; }
.bar-chairs::-webkit-scrollbar { display: none; }
.pill { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.82rem; white-space: nowrap; }
.pill[aria-current="page"] { background: var(--marker); color: var(--on-marker); border-color: var(--marker); }
.pill.seen:not([aria-current="page"]) { border-color: var(--marker); }
.bar-terms { flex: none; border: 1px solid var(--ink); background: none; border-radius: 999px; padding: 0.15rem 0.75rem; font-size: 0.82rem; }

/* hub */
.hub { padding-block: 2rem 3rem; display: flex; flex-direction: column; gap: 1.75rem; }
.hub h1 { font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1.02; letter-spacing: -0.015em; font-weight: 700; font-variation-settings: "opsz" 144; }
.hub h1 em { font-style: italic; font-weight: 500; color: var(--marker); }
.hub .dek { max-width: 60ch; font-size: 1.08rem; }
.circle { position: relative; width: min(100%, 580px); aspect-ratio: 1; margin: 0 auto; max-width: 100%; }
.circle svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 6; }
.spoke { stroke: var(--marker); stroke-width: 1.5; opacity: 0.55; }
.chair { position: absolute; transform: translate(-50%, -50%); width: 25%; min-height: 19%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 18px; padding: 0.4rem 0.35rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; text-align: center; transition: transform 160ms ease, border-color 160ms ease; }
.chair:hover { transform: translate(-50%, -50%) scale(1.04); border-color: var(--marker); }
.chair .kicker { font-size: 0.62rem; }
.chair .nm { font-family: var(--font-display); font-weight: 600; font-size: clamp(0.82rem, 2.6vw, 1.05rem); line-height: 1.15; }
.chair.seen { background: var(--marker-soft); border-color: var(--marker); }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36%; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem; text-align: center; padding: 0.5rem; }
.center .nm { font-family: var(--font-display); font-weight: 600; font-size: clamp(0.95rem, 3vw, 1.3rem); line-height: 1.1; }
.center .ct { font-family: var(--font-mono); font-size: 0.7rem; color: var(--amber); letter-spacing: 0.06em; text-transform: uppercase; }
.dot-mark { fill: var(--amber); }
.hub-foot { max-width: 62ch; font-size: 0.9rem; color: var(--muted); }

/* station */
.station { padding-block: 2rem 4rem; display: flex; flex-direction: column; gap: 1.75rem; }
.station > header { display: flex; flex-direction: column; gap: 0.5rem; max-width: 64ch; }
.station h2 { font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.08; font-variation-settings: "opsz" 120; }
.lede { font-size: 1.06rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.15rem; display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }
.card h3 { font-size: 1.25rem; }
.q { font-family: var(--font-display); font-size: 1.15rem; font-weight: 500; line-height: 1.35; }
.opts { display: flex; flex-direction: column; gap: 0.5rem; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 0.6rem 0.8rem; line-height: 1.4; }
.opt:hover { border-color: var(--marker); }
.opt[aria-pressed="true"] { border-color: var(--marker); background: var(--marker-soft); }
.note { border-left: 3px solid var(--sage); background: var(--sage-soft); padding: 0.65rem 0.85rem; border-radius: 0 10px 10px 0; font-size: 0.95rem; }
.note.you { border-left-color: var(--amber); background: var(--amber-soft); }
.note b { font-weight: 700; }
.btn { border: 1.5px solid var(--marker); background: var(--marker); color: var(--on-marker); border-radius: 999px; padding: 0.4rem 1rem; font-weight: 600; font-size: 0.92rem; }
.btn.ghost { background: none; color: var(--marker); }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

/* sorting cards */
.sort-list { display: grid; gap: 0.6rem; }
.sitem { border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 0.8rem; display: flex; flex-direction: column; gap: 0.55rem; background: var(--bg); }
.sitem .txt { font-weight: 600; line-height: 1.35; }
.bins { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.bin { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.84rem; }
.bin[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.verdict { font-size: 0.92rem; color: var(--muted); }
.verdict b { color: var(--ink); }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.6rem; }
.tally div { border: 1px dashed var(--line); border-radius: 12px; padding: 0.6rem; font-size: 0.88rem; min-width: 0; }
.tally strong { display: block; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.2rem; }

/* phases */
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.6rem; }
.slot { border: 1.5px dashed var(--line); border-radius: 14px; min-height: 4.2rem; padding: 0.6rem 0.75rem; display: flex; flex-direction: column; gap: 0.3rem; }
.slot .n { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.slot.filled { border-style: solid; background: var(--bg); }
.slot.right { border-color: var(--sage); }
.slot.wrong { border-color: var(--amber); }
.slot .t { font-family: var(--font-display); font-weight: 600; line-height: 1.2; }
.pool { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chip { border: 1.5px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 0.25rem 0.85rem; font-size: 0.9rem; }
.dd { font-size: 0.9rem; display: grid; gap: 0.3rem; }
.dd span { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; }
.dd .does span { color: var(--sage); }
.dd .doesnt span { color: var(--amber); }

/* network */
.net-wrap { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
@media (max-width: 720px) { .net-wrap { grid-template-columns: minmax(0, 1fr); } }
.net svg { width: 100%; height: auto; display: block; }
.n-line { stroke: var(--line); stroke-width: 1.5; }
.n-hub { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 2; }
.n-node { fill: var(--marker-soft); stroke: var(--marker); stroke-width: 1.5; }
.n-ghost { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 4; }
.n-lbl { fill: var(--ink); font-family: var(--font-body); font-size: 12px; font-weight: 600; }
.n-lbl.dim { fill: var(--muted); font-weight: 400; }
.facts { display: flex; flex-direction: column; gap: 0.55rem; font-size: 0.93rem; }
.facts li { list-style: none; border-left: 2px solid var(--marker); padding-left: 0.7rem; }
.facts ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
.src { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.src button[disabled] { opacity: 0.45; cursor: default; }

/* openers */
.seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.6rem; }
.seat { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 14px; padding: 0.7rem 0.8rem; display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.seat[aria-pressed="true"] { border-color: var(--marker); background: var(--marker-soft); }
.seat .t { font-weight: 700; line-height: 1.3; }
.seat .d { font-size: 0.86rem; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
.tag { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 6px; padding: 0 0.35rem; }
.cover { display: grid; gap: 0.35rem; }
.cov { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 2rem; gap: 0.6rem; align-items: center; font-size: 0.88rem; }
.track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.track i { display: block; height: 100%; background: var(--marker); border-radius: 99px; }
.cov .num { font-family: var(--font-mono); font-size: 0.78rem; text-align: right; font-variant-numeric: tabular-nums; }
.votes { display: grid; gap: 0.4rem; }
.vote { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; border-bottom: 1px solid var(--line); padding-bottom: 0.4rem; }
.toggle { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0.1rem 0.75rem; font-size: 0.84rem; min-width: 6.5rem; }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* framing */
textarea, input[type="text"] { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 0.6rem 0.75rem; line-height: 1.45; }
textarea:focus, input[type="text"]:focus { border-color: var(--marker); outline: none; }
.readback { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.45; }
.readback mark { background: var(--amber-soft); color: var(--ink); border-bottom: 2px solid var(--amber); padding: 0 0.1em; }
.who { display: grid; gap: 0.6rem; }
.who label { font-size: 0.92rem; font-weight: 600; display: flex; flex-direction: column; gap: 0.25rem; }
.ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.5rem; }
.rung { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 0.55rem 0.7rem; display: flex; flex-direction: column; gap: 0.15rem; }
.rung b { font-family: var(--font-display); font-weight: 600; }
.rung small { color: var(--muted); font-size: 0.82rem; line-height: 1.35; }
.rung[aria-pressed="true"] { border-color: var(--marker); background: var(--marker-soft); }

/* square timeline */
.timeline { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--line); margin-left: 0.4rem; }
.tl { position: relative; padding: 0 0 1.2rem 1.2rem; display: flex; flex-direction: column; gap: 0.2rem; max-width: 64ch; }
.tl::before { content: ""; position: absolute; left: -7px; top: 0.45rem; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.tl .when { font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.04em; color: var(--muted); }

/* mirror */
.axes { display: flex; flex-direction: column; gap: 1.2rem; }
.axis { display: grid; gap: 0.35rem; }
.axis .poles { display: flex; justify-content: space-between; gap: 1rem; font-size: 0.86rem; }
.axis .poles span:last-child { text-align: right; }
.axis .rail { position: relative; height: 22px; }
.axis .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); }
.mk { position: absolute; top: 3px; width: 16px; height: 16px; border-radius: 50%; transform: translateX(-50%); }
.mk.you { background: var(--amber); }
.mk.model { border: 2.5px solid var(--sage); background: var(--surface); }
.axis .src-l { font-size: 0.78rem; color: var(--muted); }
.axis.empty { opacity: 0.45; }
.legend { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: 0.85rem; }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.pulls { display: flex; flex-direction: column; gap: 0.7rem; }
.pull { font-family: var(--font-display); font-size: 1.12rem; line-height: 1.45; border-left: 3px solid var(--amber); padding-left: 0.85rem; }
pre.summary { white-space: pre-wrap; font-family: var(--font-mono); font-size: 0.8rem; line-height: 1.55; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem; margin: 0; max-height: 22rem; overflow: auto; }

/* terms dialog */
dialog { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); max-width: min(560px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgb(10 14 20 / 0.45); }
.terms { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.9rem; max-height: 80vh; overflow: auto; }
.terms dl { margin: 0; display: flex; flex-direction: column; gap: 0.75rem; }
.terms dt { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
.terms dd { margin: 0.1rem 0 0; font-size: 0.93rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

    case "penmove": st.pen.move = i; break;
    case "phase": if (st.phases.order.length < 6) st.phases.order.push(+b.getAttribute("data-n")); break;
    case "phasereset": st.phases.order = []; break;
    case "handoff": st.phases.handoff = i; break;
    case "consult": if (st.fn.consulted.indexOf(id) < 0) st.fn.consulted.push(id); break;
    case "approach": st.fn.approached = st.fn.consulted.length; break;
    case "offer": st.fn.offer = i; break;
    case "no": st.fn.no = i; break;
    case "seat": var k = st.op.seats.indexOf(id); if (k >= 0) st.op.seats.splice(k, 1); else if (st.op.seats.length < 6) st.op.seats.push(id); break;
    case "vote": st.op.votes[id] = !st.op.votes[id]; st.op.checked = false; break;
    case "votecheck": st.op.checked = true; break;
    case "rung": st.fr.start = id; break;
    case "cc": st.fr.cc[id] = v; break;
    case "scope": st.fr.scope = i; break;
    case "tf": st.tf.sort[id] = v; break;
    case "bf": st.tf.bf[id] = v; break;
    case "gi": st.gi.sort[id] = v; break;
    case "first": st.gi.first = i; break;
    case "rift": st.gi.rift = i; break;
    case "sq": st.sq.q = i; break;
    case "copy": copySummary(); return;
    case "terms": $("#termsBtn").click(); return;
    case "reset":
      if (b.getAttribute("data-armed") !== "1") { b.setAttribute("data-armed", "1"); b.textContent = "Tap again to erase every choice"; return; }
      st = blank(); save(); go("circle"); return;
    default: return;
  }
  save(); render(false); restoreFocus(keepFocus);
});
function restoreFocus(k) {
  var sel = '[data-act="' + k.act + '"]' + (k.id ? '[data-id="' + k.id + '"]' : '') + (k.v ? '[data-v="' + k.v + '"]' : '') + (k.i !== null ? '[data-i="' + k.i + '"]' : '');
  var el = document.querySelector(sel);
  if (el && !el.disabled) el.focus({ preventScroll: true });
}
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "sentence") { st.fr.sentence = t.value; save(); renderReadback(); }
  else if (t.hasAttribute && t.hasAttribute("data-who")) { st.fr.who[t.getAttribute("data-who")] = t.value; save(); }
});
function copySummary() {
  var txt = $("#summary").textContent, out = $("#copied");
  function fallback() { var r = document.createRange(); r.selectNodeContents($("#summary")); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); out.textContent = "Selected. Copy it with your keyboard or menu."; }
  try { navigator.clipboard.writeText(txt).then(function () { out.textContent = "Copied."; }, fallback); } catch (e) { fallback(); }
}
var dlg = $("#terms");
$("#termsList").innerHTML = TERMS.map(function (t) { return '<div><dt>' + esc(t[0]) + '</dt><dd>' + esc(t[1]) + '</dd></div>'; }).join("");
$("#termsBtn").addEventListener("click", function () { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); });
$("#termsClose").addEventListener("click", function () { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); });
$("#home").addEventListener("click", function () { go("circle"); });
window.addEventListener("hashchange", route);
route();
})();
</script>
